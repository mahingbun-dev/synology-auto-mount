name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          bash -n install.sh
          bash -n uninstall.sh
      - name: ShellCheck
        run: shellcheck --severity=error install.sh uninstall.sh
